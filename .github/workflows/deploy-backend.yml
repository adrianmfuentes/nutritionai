name: Deploy Backend (Oracle Ampere A1)

# Builds the backend as a multi-arch container image (amd64 for local/dev use,
# arm64 for the Oracle Ampere A1 host), pushes it to GHCR, then pings a
# Portainer webhook so the stack running under Nginx Proxy Manager pulls the
# new image and recreates the container. No SSH keys required.
#
# One-time setup on the Oracle A1 box:
#   1. Portainer stack "nutrition-api" using backend/docker-compose.yml,
#      attached to the nginx-proxy-manager_default network.
#   2. In that stack's settings, create a Webhook and save its URL as the
#      repo secret PORTAINER_WEBHOOK_URL (Settings > Secrets and variables > Actions).
#   3. Make the ghcr.io/<owner>/nutritionai-api package public, OR run
#      `docker login ghcr.io` once on the host with a PAT that has read:packages.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nutritionai-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::PORTAINER_WEBHOOK_URL secret not set — image was pushed but the stack was not redeployed. Add the secret to enable auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK_URL"
          echo "Portainer redeploy triggered."
