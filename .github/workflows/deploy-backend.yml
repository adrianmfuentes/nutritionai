name: Deploy Backend (Oracle Ampere A1)

# Builds the backend as a multi-arch container image (amd64 for local/dev use,
# arm64 for the Oracle Ampere A1 host), pushes it to GHCR, then SSHes into the
# host and redeploys the "nutritionai" docker-compose stack from
# the repo checkout at secrets.ORACLE_PATH.
#
# The two platforms are built natively on their own runners (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm) instead of cross-building arm64
# via QEMU. QEMU-emulated `pnpm install` under Node 20/Alpine on the arm64
# leg was crashing with SIGILL ("Illegal instruction") on this repo - a known
# QEMU user-mode emulation bug with Node's V8 on arm64, not a project issue.
# Native arm64 runners sidestep it entirely and build faster besides. Each
# platform pushes its image by digest; a separate `merge` job combines the
# digests into the final multi-arch `:latest` / `:<sha>` manifests.
#
# One-time setup on the Oracle A1 box:
#   1. Repo cloned at the path in ORACLE_PATH, checked out on the branch this
#      workflow deploys from (main), with a clean working tree so `git pull
#      --ff-only` always succeeds.
#   2. Stack already brought up once via `docker compose up -d` in
#      <ORACLE_PATH>/backend (backend/docker-compose.yml), with a .env file
#      there providing DB_*, JWT_SECRET, etc.
#   3. Make the ghcr.io/<owner>/nutritionai-api package public, OR run
#      `docker login ghcr.io` once on the host with a PAT that has read:packages.
#
# Repo secrets required (Settings > Secrets and variables > Actions):
#   ORACLE_IP      - hostname or IP of the Oracle A1 box
#   ORACLE_USER    - SSH user (e.g. ubuntu)
#   ORACLE_SSH_KEY - private key with access to that user (no passphrase)
#   ORACLE_PORT    - SSH port
#   ORACLE_PATH    - absolute path of the repo checkout on the box
#                    (e.g. /home/ubuntu/projects/nutritionai)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nutritionai-api

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.ORACLE_PATH }}
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "::error::ORACLE_PATH secret is empty. Set it to the absolute path of the repo checkout on the box (e.g. /home/ubuntu/projects/nutritionai)."
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "::error::DEPLOY_PATH '$DEPLOY_PATH' does not exist on this host. One-time setup: SSH in and run 'git clone <repo-url> \"$DEPLOY_PATH\"', then 'cd \"$DEPLOY_PATH/backend\" && docker compose up -d' once so the .env and containers exist before this workflow takes over."
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git pull --ff-only
            cd backend
            # The package is public, so no login is needed to pull it - but any
            # stale/bad credentials cached in ~/.docker/config.json for ghcr.io
            # take priority over anonymous access and cause a misleading "denied"
            # error. Clear them unconditionally before pulling.
            docker logout ghcr.io || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # Apply schema (idempotent, CREATE ... IF NOT EXISTS throughout).
            # The postgres_data_prod volume was created before init.sql was
            # remounted into docker-entrypoint-initdb.d, so Postgres never ran
            # it on first boot. Running it explicitly here keeps the schema in
            # sync on every deploy regardless of when the volume was created.
            DB_USER_VAL=$(grep -E '^DB_USER=' .env | tail -1 | cut -d '=' -f2-)
            DB_NAME_VAL=$(grep -E '^DB_NAME=' .env | tail -1 | cut -d '=' -f2-)
            docker exec -i nutrition_db_prod psql -U "$DB_USER_VAL" -d "$DB_NAME_VAL" < init.sql
