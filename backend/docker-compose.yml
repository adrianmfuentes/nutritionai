version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrition_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/adrianmfuentes/nutritionai-api:latest
    pull_policy: always
    container_name: nutrition_api_prod
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: nutrition_db_prod
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      LOG_PATH: ${LOG_PATH}
      UPLOAD_PATH: /app/uploads
      LOG_LEVEL: warn
      # Parámetros de rendimiento optimizados
      PGPOOL_MAX: 30
      PGPOOL_IDLE_TIMEOUT: 30000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      # Notificaciones push (opcional): base64 del JSON de credenciales de la
      # cuenta de servicio de Firebase. Sin esto, los jobs de recordatorios
      # se omiten automáticamente sin error.
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      # Horarios cron (UTC) de los jobs programados
      DIGEST_CRON: ${DIGEST_CRON:-0 9 * * 1}
      REMINDER_CRON: ${REMINDER_CRON:-0 20 * * *}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - proxy_network
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data_prod:
  uploads_data:
  logs_data:

networks:
  proxy_network:
    external: true
    name: nginx-proxy-manager_default
